services:
  mysql:
    image: mysql:8.4
    container_name: sgv-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sgv
      MYSQL_USER: sgv_user
      MYSQL_PASSWORD: sgv_password

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: sgv-backend
    restart: unless-stopped

    working_dir: /app

    environment:
      DATABASE_URL: "mysql://sgv_user:sgv_password@172.22.0.1:3307/sgv"
      DATABASE_HOST: "172.22.0.1"
      DATABASE_PORT: "3307"
      DATABASE_USER: "sgv_user"
      DATABASE_PASSWORD: "sgv_password"
      DATABASE_NAME: "sgv"
      JWT_SECRET: "SGV_JWT_SECRET_2026_TROCAR_EM_PRODUCAO"

    ports:
      - "3001:3001"

    depends_on:
      mysql:
        condition: service_healthy

    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  mysql_data:
